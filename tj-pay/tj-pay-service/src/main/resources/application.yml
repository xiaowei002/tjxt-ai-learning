server:
  port: 8087  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
  error:
    include-message: always #返回的响应体带上message
spring:
  profiles:
    active: local
  application:
    name: pay-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.tianji.pay.controller
    title: 天机学堂 - 支付中心接口文档
    description: 该服务提供微信、支付宝等各种平台的支付、退款等功能
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
  jdbc:
    database: tj_pay
  pay:
    notifyHost: ${TJ_PAY_NOTIFY_HOST:}
    ali:
      appId: ${TJ_PAY_ALI_APP_ID:}
      merchantPrivateKey: ${TJ_PAY_ALI_MERCHANT_PRIVATE_KEY:}
      publicKey: ${TJ_PAY_ALI_PUBLIC_KEY:}
    wx:
      appId: ${TJ_PAY_WX_APP_ID:}
      mchId: ${TJ_PAY_WX_MCH_ID:}
      mchSerialNo: ${TJ_PAY_WX_MCH_SERIAL_NO:}
      privateKey: ${TJ_PAY_WX_PRIVATE_KEY:}
      apiV3Key: ${TJ_PAY_WX_API_V3_KEY:}
