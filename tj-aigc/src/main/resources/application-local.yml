spring:
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848} # nacos注册中心（Docker 映射到本机）
      username: nacos
      password: nacos
      discovery:
        namespace: f923fb34-cb0a-4c06-8fca-ad61ea61a3f0
        group: DEFAULT_GROUP
      config:
        namespace: f923fb34-cb0a-4c06-8fca-ad61ea61a3f0
  config:
    import:
      - nacos:${spring.application.name}.yaml # 导入本服务的配置
      - nacos:shared-spring.yaml # 共享spring配置
      - nacos:shared-redis.yaml # 共享redis配置
      - nacos:shared-mybatis.yaml # 共享mybatis配置
      - nacos:shared-logs.yaml # 共享日志配置
      - nacos:shared-feign.yaml # 共享feign配置
  # mongoDB配置
  data:
    mongodb:
      host: localhost
      port: 27017
      database: tianji
      authentication-database: admin # 认证数据库
      username: tianji
      password: "123321"
      auto-index-creation: true # 自动创建索引
logging:
  level:
    com.tianji: debug
