services:
  mysql:
    image: registry.cn-beijing.aliyuncs.com/itcast/mysql:8.0.29
    # 避免与本机其他 Compose 项目的通用 mysql 容器名冲突。
    container_name: tjxt-mysql
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: itcast321bca
    command:
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --server-id=1010
    volumes:
      # Windows 绑定目录大小写不敏感，与课程预置的 Linux MySQL 数据字典不兼容。
      - "mysql-data:/var/lib/mysql"
      - "./mysql/init:/docker-entrypoint-initdb.d"
    restart: always
    networks:
      - new
  nacos:
    image: registry.cn-beijing.aliyuncs.com/itcast/nacos-server:v2.4.2
    container_name: nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=itcast321bca
      - MYSQL_SERVICE_DB_NAME=nacos
      - SPRING_DATASOURCE_PLATFORM=mysql
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=OGE2MjdhNDU3OGFjZTM4NDAxN2M5OTdmMTJkNjhiMjM=
      - NACOS_AUTH_IDENTITY_KEY=itcast
      - NACOS_AUTH_IDENTITY_VALUE=itcast
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: always
    depends_on:
      - mysql
    networks:
      - new
  xxl-job:
    image: registry.cn-beijing.aliyuncs.com/itcast/xxl-job-admin:2.3.0
    container_name: xxljob
    ports:
      - "8880:8880"
    volumes:
      - "./xxl-job/logs:/data/applogs"
      - "./xxl-job/application.properties:/config/application.properties"
    networks:
      - new
    restart: always
    depends_on:
      - mysql
  seata:
    image: registry.cn-beijing.aliyuncs.com/itcast/seata-server:2.1.0-mysql
    container_name: seata
    ports:
      - "8099:8099"
      - "7099:7099"
    environment:
      # 本机启动的 Java 服务从 Nacos 获取此地址，并通过 Docker 映射端口连接 Seata。
      # Seata 会忽略 127.0.0.1，请在 .env 中配置宿主机局域网 IPv4。
      SEATA_IP: ${SEATA_IP:?请复制 .env.example 为 .env 并配置宿主机局域网 IPv4}
    volumes:
      - "./seata:/seata-server/resources"
    networks:
      - new
    restart: always
    depends_on:
      - mysql
      - nacos
  # Gogs 和 Jenkins 仅用于课程 CI/CD，不影响本地业务运行；需要时取消注释并准备对应数据目录。
  # gogs:
  #   image: registry.cn-beijing.aliyuncs.com/itcast/gogs:0.12
  #   container_name: gogs
  #   ports:
  #     - "10022:22"
  #     - "10880:3000"
  #   environment:
  #     TZ: Asia/Shanghai
  #   volumes:
  #     - "./gogs:/data"
  #   networks:
  #     - new
  #   restart: always
  #   depends_on:
  #     - mysql
  # jenkins:
  #   image: jenkins/jenkins:2.361.1-lts-jdk11
  #   container_name: jenkins
  #   ports:
  #     - "18080:8080"
  #     - "50000:50000"
  #   environment:
  #     - "JAVA_OPTS=-server -Xms1024m -Xmx1024m -XX:PermSize=256m -XX:MaxPermSize=512m"
  #   volumes:
  #     - "./jenkins:/var/jenkins_home"
  #     - "/usr/bin/docker:/usr/bin/docker"
  #     - "/var/run/docker.sock:/var/run/docker.sock"
  #   networks:
  #     - new
  mq:
    image: registry.cn-hangzhou.aliyuncs.com/itheima/rabbitmq:3.9.17-management-delayed
    container_name: mq
    hostname: mq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=tjxt
      - RABBITMQ_DEFAULT_PASS=123321
    restart: always
    networks:
      - new
  es:
    image: registry.cn-beijing.aliyuncs.com/itcast/elasticsearch:7.12.1
    container_name: es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
    volumes:
      - "./es/data:/usr/share/elasticsearch/data"
      - "./es/plugins:/usr/share/elasticsearch/plugins"
    restart: always
    networks:
      - new
  redis:
    image: registry.cn-beijing.aliyuncs.com/itcast/redis:7.0.0
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "./redis/conf:/usr/local/etc/redis"
      - "./redis/data:/tmp"
    networks:
      - new
    restart: always
    entrypoint: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
  # Redis Stack 用于 Spring AI RAG 向量库；与业务缓存 Redis(6379) 相互独立。
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6380:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: "--appendonly yes"
    volumes:
      - "redis-stack-data:/data"
    networks:
      - new
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  mongodb:
    image: mongo:4.4.18
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: tianji
      MONGO_INITDB_ROOT_PASSWORD: 123321
    volumes:
      - "mongodb-data:/data/db"
    networks:
      - new
    restart: always
    healthcheck:
      test: [ "CMD", "mongo", "--quiet", "--username", "tianji", "--password", "123321", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  # Elasticsearch 8 用于 Spring AI 知识库，与课程搜索使用的 Elasticsearch 7 相互独立。
  es2:
    image: registry.cn-beijing.aliyuncs.com/itcast/elasticsearch:8.13.4
    container_name: es2
    ports:
      - "19200:9200"
      - "19300:9300"
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
    volumes:
      - "es2-data:/usr/share/elasticsearch/data"
      - "es2-plugins:/usr/share/elasticsearch/plugins"
    privileged: true
    networks:
      - es2
    restart: always
  kibana2:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana2
    ports:
      - "15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://es2:9200"]'
    depends_on:
      - es2
    networks:
      - es2
    restart: always
  nginx:
    image: harbor.shutongmofang.com:10000/library/nginx:1.29.3
    container_name: tjxt-nginx
    ports:
      - "80:80"
    volumes:
      - "./nginx/conf:/etc/nginx:ro"
      - "./tj-portal:/usr/local/src/tj-portal:ro"
      - "./tj-admin:/usr/local/src/tj-admin:ro"
    networks:
      - new
    restart: always
networks:
  new:
    name: tjxt
  es2:
    name: es2-net
volumes:
  mysql-data:
    name: tjxt-mysql-data
  mongodb-data:
    name: tjxt-mongodb-data
  es2-data:
    name: tjxt-es2-data
  es2-plugins:
    name: tjxt-es2-plugins
  redis-stack-data:
    name: tjxt-redis-stack-data
